# vendor/habeuk/habeuk_base_symfony/config/services.yaml
services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Chargement auto de tous les services du bundle
    Habeuk\HbkSymfony\:
        resource: '../src/'
        exclude: '../src/{HbkSymfonyBundle.php,Enum,Entity,DependencyInjection}'

    # Déclaration du service tiers utilisé par SendMails
    Egulias\EmailValidator\EmailValidator:
        # Aucune dépendance obligatoire dans le constructeur

    # Pool de cache dont CacheManager a besoin
    app.data_cache_filesystem:
        parent: cache.adapter.filesystem
        tags:
            - name: cache.pool
              namespace: 'hbk_symfony'
              default_lifetime: 86400